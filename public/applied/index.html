<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks for applying | Match a Dev</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8F6EA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'Fraunces';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/fraunces-latin.woff2) format('woff2');}
  @font-face{font-family:'Fraunces';font-style:italic;font-weight:400 600;font-display:swap;src:url(/fonts/fraunces-italic-latin.woff2) format('woff2');}
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 600;font-display:swap;src:url(/fonts/inter-latin.woff2) format('woff2');}

  :root{
    --bg:        #F8F6EA;   /* matcha-latte cream page ground */
    --bg-deep:   #EDEFD9;   /* pale matcha band */
    --ink:       #1E2B16;   /* deep matcha green, primary text */
    --ink-soft:  #4B5A3E;   /* muted green for secondary text */
    --paper:     #FFFEF8;   /* card/email paper */
    --accent:    #557318;   /* deep matcha, safe for text and buttons */
    --accent-ink:#FFFDF5;   /* text on accent */
    --matcha:    #8DB33A;   /* bright matcha, decorative only (logo cup) */
    --rule:      #DCDDC2;   /* hairline rule */
    --rule-deep: rgba(30,43,22,0.16);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:        #141B10;
      --bg-deep:   #0F150C;
      --ink:       #EEF0DC;
      --ink-soft:  #B9C4A8;
      --paper:     #1B2415;
      --accent:    #A9C95A;
      --accent-ink:#141B10;
      --matcha:    #A9C95A;
      --rule:      #2C3823;
      --rule-deep: rgba(238,240,220,0.16);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:        #141B10;
    --bg-deep:   #0F150C;
    --ink:       #EEF0DC;
    --ink-soft:  #B9C4A8;
    --paper:     #1B2415;
    --accent:    #A9C95A;
    --accent-ink:#141B10;
    --matcha:    #A9C95A;
    --rule:      #2C3823;
    --rule-deep: rgba(238,240,220,0.16);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-inline:max(16px, env(safe-area-inset-left,0px));
  }
  .wrap{width:100%;max-width:720px;margin:0 auto;}
  header{padding-block:16px;border-bottom:1px solid var(--rule);}
  .wordmark{display:inline-flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:-0.01em;color:var(--ink);text-decoration:none;}
  .wordmark svg.cup{flex:none;width:30px;height:30px;color:var(--ink);margin-top:-2px;}
  .wm-a{font-style:italic;color:var(--accent);font-weight:500;padding:0 1px;}
  main{flex:1;padding-block:72px 64px;}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-0.01em;line-height:1.15;font-size:clamp(32px,6vw,48px);margin:0;max-width:16ch;}
  p{margin:18px 0 0;max-width:48ch;color:var(--ink-soft);font-size:17px;}
  a.back{display:inline-block;margin-top:32px;color:var(--accent);font-weight:500;text-decoration:none;}
  a.back:hover{text-decoration:underline;}
  @media (max-width:560px){
    header{padding-block:10px;}
    main{padding-block:44px 40px;}
    p{font-size:16px;}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="Match a Dev home"><svg class="cup" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 13h24c0 7-5.4 12-12 12S4 20 4 13Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="16" cy="13" rx="12" ry="3" fill="var(--matcha)" stroke="currentColor" stroke-width="1.6"/><path d="M12.5 25.2 13 28h6l.5-2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span aria-hidden="true">match<span class="wm-a">a</span>dev</span></a>
  </div>
</header>
<main>
  <div class="wrap">
    <h1>Thanks for applying.</h1>
    <p>We read every application by hand and will get back to you by email if it's a good fit.</p>
    <p>If we feature you, we'll send you the profile to check before it goes out.</p>
    <a class="back" href="/">&larr; Back to Match a Dev</a>
  </div>
</main>
</body>
</html>
